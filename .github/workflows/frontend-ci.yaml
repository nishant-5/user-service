name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  frontend-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/taskpad-frontend:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/taskpad-frontend:${{ steps.image.outputs.tag }}
      
            - name: Update GitOps repository
            env:
              GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
              IMAGE_TAG: ${{ steps.image.outputs.tag }}
            run: |
              git clone https://x-access-token:${GITOPS_TOKEN}@github.com/nishant-5/gitops.git gitops
          
              cd gitops
          
              sed -i '/^frontend:/,/^backend:/ s/^\(\s*tag:\s*\).*/\1'${IMAGE_TAG}'/' envs/dev/values.yaml
          
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
              git add envs/dev/values.yaml
          
              git commit -m "Update frontend image to ${IMAGE_TAG}"
          
              git push origin main