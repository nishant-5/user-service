name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Add this once we have backend tests
      # - name: Run tests
      #   run: pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/taskpad-backend:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/taskpad-backend:${{ steps.image.outputs.tag }}

      - name: Update GitOps repository
        working-directory: .
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/nishant-5/gitops.git gitops

          cd gitops

          yq -i '.backend.image.tag = strenv(IMAGE_TAG)' envs/dev/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add envs/dev/values.yaml

          git commit -m "Update backend image to ${IMAGE_TAG}"

          git push origin main